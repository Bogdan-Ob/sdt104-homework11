<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/container.css">
    <title>List of IT Courses</title>
</head>
<body>
    <header class="nav-header">

        <img class="nav-img" src="photo/logo.png" alt="IT Course Logo" height="50px"; width="auto";>

        <nav class="navigation">
            <a href="index.html">Main</a> 
            <a href="info.html">More Information</a>
            <a href="">Sign in</a>
        </nav>

        <div class="nav-button">
            <a href="" class="nav-cons">Register</a>
        </div>

    </header>

    <main>
        <section class="cont-grid">
    
        </section>
    </main>

    <footer class="footer-main">
        <p>&copy; 2026 IT Academy. All rights reserved.</p>
    </footer>

    <div id="registrationModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Registration for Course</h2>
            <form id="registrationForm">
                <label for="courseSelect">Choose Course:</label>
                <select id="courseSelect" required>
                    </select>

                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>

                <button type="submit" class="submit-btn">Send Application</button>
            </form>
        </div>
    </div>

    <script type="module" src="scripts/container.js"></script>
</body>
</html>
